info:
  contact: {}
  description: Mini social network with users, public/private posts, and friend requests
  title: SocialNet API
  version: "1.0"
paths:
  /v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_donca_user-crud_internal_auth_models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_donca_user-crud_internal_auth_models.AuthResponse'
      summary: Login
      tags:
      - Auth
  /v1/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_donca_user-crud_internal_auth_models.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_donca_user-crud_internal_auth_models.AuthResponse'
      summary: Register a new user
      tags:
      - Auth
  /v1/friendships/friends:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_donca_user-crud_internal_friendships_models.FriendsListResponse'
      security:
      - BearerAuth: []
      summary: List accepted friends
      tags:
      - Friendships
  /v1/friendships/requests:
    post:
      consumes:
      - application/json
      parameters:
      - description: Friend request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_donca_user-crud_internal_friendships_models.FriendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_donca_user-crud_internal_friendships_models.FriendshipResponse'
      security:
      - BearerAuth: []
      summary: Send a friend request
      tags:
      - Friendships
  /v1/friendships/requests/{id}/accept:
    post:
      parameters:
      - description: Request ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_donca_user-crud_internal_friendships_models.FriendshipResponse'
      security:
      - BearerAuth: []
      summary: Accept a friend request
      tags:
      - Friendships
  /v1/friendships/requests/{id}/reject:
    post:
      parameters:
      - description: Request ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_donca_user-crud_internal_friendships_models.FriendshipResponse'
      security:
      - BearerAuth: []
      summary: Reject a friend request
      tags:
      - Friendships
  /v1/friendships/requests/received:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_donca_user-crud_internal_friendships_models.FriendshipsListResponse'
      security:
      - BearerAuth: []
      summary: List pending received friend requests
      tags:
      - Friendships
  /v1/friendships/requests/sent:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_donca_user-crud_internal_friendships_models.FriendshipsListResponse'
      security:
      - BearerAuth: []
      summary: List pending sent friend requests
      tags:
      - Friendships
  /v1/me/profile:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Profile payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_donca_user-crud_internal_users_models.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_donca_user-crud_internal_users_models.UserResponse'
      security:
      - BearerAuth: []
      summary: Update own profile
      tags:
      - Users
  /v1/posts:
    post:
      consumes:
      - application/json
      parameters:
      - description: Post payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_donca_user-crud_internal_posts_models.CreatePostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_donca_user-crud_internal_posts_models.PostResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_donca_user-crud_pkg_kit_wrapper.Response-any'
      security:
      - BearerAuth: []
      summary: Create a post
      tags:
      - Posts
  /v1/posts/{id}:
    delete:
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_donca_user-crud_pkg_kit_wrapper.Response-any'
      security:
      - BearerAuth: []
      summary: Delete a post
      tags:
      - Posts
    get:
      description: Respects public/private visibility for the viewer
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_donca_user-crud_internal_posts_models.PostResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_donca_user-crud_pkg_kit_wrapper.Response-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_donca_user-crud_pkg_kit_wrapper.Response-any'
      summary: Get post by ID
      tags:
      - Posts
    put:
      consumes:
      - application/json
      parameters:
      - description: Post ID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_donca_user-crud_internal_posts_models.UpdatePostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_donca_user-crud_internal_posts_models.PostResponse'
      security:
      - BearerAuth: []
      summary: Update a post
      tags:
      - Posts
  /v1/posts/feed:
    get:
      parameters:
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_donca_user-crud_internal_posts_models.PostsListResponse'
      security:
      - BearerAuth: []
      summary: Get personalized feed
      tags:
      - Posts
  /v1/users:
    get:
      parameters:
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_donca_user-crud_internal_users_models.UsersListResponse'
      summary: List user profiles
      tags:
      - Users
  /v1/users/{id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_donca_user-crud_pkg_kit_wrapper.Response-any'
      security:
      - BearerAuth: []
      summary: Delete user account
      tags:
      - Users
    get:
      description: Returns full user data (authenticated owner only for email)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_donca_user-crud_internal_users_models.UserResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_donca_user-crud_pkg_kit_wrapper.Response-any'
      summary: Get user by ID
      tags:
      - Users
    put:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_donca_user-crud_internal_users_models.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_donca_user-crud_internal_users_models.UserResponse'
      security:
      - BearerAuth: []
      summary: Update user account
      tags:
      - Users
  /v1/users/{id}/profile:
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_donca_user-crud_internal_users_models.ProfileResponse'
      summary: Get public profile
      tags:
      - Users
  /v1/users/{userId}/posts:
    get:
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_donca_user-crud_internal_posts_models.PostsListResponse'
      summary: List posts on a user wall
      tags:
      - Posts
securityDefinitions:
  BearerAuth:
    description: 'JWT token. Format: Bearer &lt;token&gt;'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
